[settings]
timeout = 1000

[relaychain]
chain = "rococo-local"
default_command = "./bin/polkadot"

  [[relaychain.nodes]]
  name = "alice"
  validator = true
  # ws_port was deprecated 
  rpc_port = 9900
  args = [ "-lparachain=debug" ]

  [[relaychain.nodes]]
  name = "bob"
  validator = true
  args = [ "-lparachain=debug" ]

[[parachains]]
id = 1000
add_to_genesis = true
cumulus_based = true
chain = "local"

  [[parachains.collators]]
  name = "frontier-parachain-collator01"
  command = "./target/release/frontier-parachain-node"
  # ws_port was deprecated 
  rpc_port = 9910
